<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ThreadTalk — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a0f;--s1:#0e1118;--s2:#151820;--s3:#1c202b;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#dde1f0;--muted:#4a5168;--accent:#6c63ff;--green:#00e5c3;--red:#f87171;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}

/* animated grid bg */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(108,99,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(108,99,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridDrift 20s linear infinite;
}
@keyframes gridDrift{to{background-position:40px 40px}}

/* radial glow center */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 40%, rgba(108,99,255,.08) 0%, transparent 70%);
}

.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}

/* logo */
.logo{display:flex;align-items:center;gap:10px;margin-bottom:36px;animation:fadeDown .5s ease both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.logo-icon{width:42px;height:42px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 24px rgba(108,99,255,.35)}
.logo h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.logo h1 em{color:var(--green);font-style:normal}
.logo small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}

/* card */
.card{width:100%;max-width:400px;background:var(--s1);border:1px solid var(--border2);border-radius:20px;padding:36px;animation:fadeUp .5s .1s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.card-head{margin-bottom:28px}
.card-head h2{font-size:20px;font-weight:600}
.card-head p{font-size:13px;color:var(--muted);margin-top:4px}

/* fields */
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input{
  width:100%;padding:12px 14px;background:var(--s3);
  border:1px solid var(--border2);border-radius:10px;
  color:var(--text);font-family:var(--font);font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.12)}
.field input::placeholder{color:var(--muted)}

/* password toggle */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px;transition:color .15s}
.pw-eye:hover{color:var(--text)}

/* btn */
.btn-primary{
  width:100%;padding:13px;background:var(--accent);border:none;
  border-radius:10px;color:#fff;font-family:var(--font);font-size:14px;
  font-weight:600;cursor:pointer;margin-top:4px;
  transition:opacity .15s,transform .1s,box-shadow .2s;
  box-shadow:0 4px 20px rgba(108,99,255,.3);
  position:relative;overflow:hidden;
}
.btn-primary::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .2s}
.btn-primary:hover{opacity:.9;box-shadow:0 6px 28px rgba(108,99,255,.45)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:default;box-shadow:none}

/* spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* error / success */
.alert{display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;font-family:var(--mono)}
.alert.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);display:block}
.alert.ok{background:rgba(0,229,195,.08);border:1px solid rgba(0,229,195,.25);color:var(--green);display:block}

/* divider */
.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* footer link */
.footer-link{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.footer-link a{color:var(--accent);text-decoration:none;font-weight:500}
.footer-link a:hover{text-decoration:underline}


</style>
</head>
<body>
<div class="page">
  <div class="logo">
    <div class="logo-icon">🧵</div>
    <div>
      <h1>Thread<em>Talk</em></h1>
      <small>v3 · auth edition</small>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue.</p>
    </div>

    <div class="alert" id="alert"></div>

    <div class="field">
      <label>Username</label>
      <input id="username" type="text" placeholder="your_username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="pw-eye" id="pw-toggle" type="button">👁</button>
      </div>
    </div>

    <button class="btn-primary" id="login-btn">Sign In</button>

    <div class="divider">or</div>
    <div class="footer-link">
      Don't have an account? <a href="signup.html">Create one</a>
    </div>
  </div>
</div>

<script>
const API = "https://threadtalks.onrender.com";

const $user  = document.getElementById("username");
const $pass  = document.getElementById("password");
const $btn   = document.getElementById("login-btn");
const $alert = document.getElementById("alert");

document.getElementById("pw-toggle").addEventListener("click",()=>{
  $pass.type = $pass.type==="password" ? "text" : "password";
});

function showErr(msg){ $alert.className="alert err"; $alert.textContent=msg; }
function showOk(msg) { $alert.className="alert ok";  $alert.textContent=msg; }
function setLoading(on){
  $btn.disabled=on;
  $btn.innerHTML=on?'<span class="spinner"></span>Signing in…':'Sign In';
}

async function login(){
  const username=$user.value.trim().toLowerCase();
  const password=$pass.value;
  if(!username||!password){showErr("Please fill in all fields.");return;}
  setLoading(true);
  try{
    const r=await fetch(`${API}/api/auth/login`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const d=await r.json();
    if(!r.ok){showErr(d.error||"Login failed.");setLoading(false);return;}
    localStorage.setItem("tt_token", d.token);
    localStorage.setItem("tt_user",  JSON.stringify(d.user));
    showOk("Success! Redirecting…");
    setTimeout(()=>{
      window.location.href = d.user.is_admin ? "admin.html" : "chat.html";
    },600);
  }catch(e){
    showErr("Cannot reach server. Is it running?");
    setLoading(false);
  }
}

$btn.addEventListener("click",login);
[$user,$pass].forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")login();}));

// If already logged in, redirect
const tok=localStorage.getItem("tt_token");
if(tok){
  fetch(`${API}/api/auth/me`,{headers:{"Authorization":"Bearer "+tok}})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d) window.location.href=d.user.is_admin?"admin.html":"chat.html"; })
    .catch(()=>{});
}
</script>
</body>
</html>
